name: productivity_suite
description: "A comprehensive personal productivity suite for Android — Tasks, Notes, Habits, Pomodoro, Budget, Calendar, Passwords, Clipboard & File Organizer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  clipboard: ^0.1.3
  
  # Icons & charts
  fl_chart: ^0.67.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
